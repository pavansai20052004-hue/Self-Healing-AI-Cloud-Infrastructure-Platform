groups:
  - name: aegiscloud-platform
    rules:
      - alert: AegisCloudServiceDown
        expr: up{job=~"monitoring-service|healing-engine|incident-intelligence-service"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "AegisCloud platform service is down"
          description: "{{ $labels.job }} has not been scrapeable for more than 1 minute."

      - alert: AegisCloudHighRequestLatency
        expr: histogram_quantile(0.95, sum(rate(http_server_requests_seconds_bucket[5m])) by (le, job)) > 1.0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High platform API latency"
          description: "{{ $labels.job }} p95 latency is above 1 second."

      - alert: AegisCloudHealingEngineErrorRate
        expr: sum(rate(http_server_requests_seconds_count{job="healing-engine", status=~"5.."}[5m])) > 0.05
        for: 3m
        labels:
          severity: critical
        annotations:
          summary: "Healing engine error rate is elevated"
          description: "The system responsible for remediation decisions is returning 5xx responses."

