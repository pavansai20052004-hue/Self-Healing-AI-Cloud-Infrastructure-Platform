apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-prediction-service
  namespace: aegiscloud
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ai-prediction-service
  template:
    metadata:
      labels:
        app: ai-prediction-service
    spec:
      containers:
        - name: ai-prediction-service
          image: aegiscloud/ai-prediction-service:0.1.0
          ports:
            - containerPort: 8090
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8090
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8090
---
apiVersion: v1
kind: Service
metadata:
  name: ai-prediction-service
  namespace: aegiscloud
spec:
  selector:
    app: ai-prediction-service
  ports:
    - port: 8090
      targetPort: 8090

