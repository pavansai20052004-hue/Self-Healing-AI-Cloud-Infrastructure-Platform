apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: aegiscloud-default-deny
  namespace: aegiscloud
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: aegiscloud-service-mesh
  namespace: aegiscloud
spec:
  podSelector:
    matchExpressions:
      - key: app
        operator: In
        values:
          - monitoring-service
          - healing-engine
          - incident-intelligence-service
          - ai-prediction-service
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - podSelector: {}
      ports:
        - protocol: TCP
          port: 8081
        - protocol: TCP
          port: 8082
        - protocol: TCP
          port: 8083
        - protocol: TCP
          port: 8090
  egress:
    - to:
        - podSelector: {}
      ports:
        - protocol: TCP
          port: 8081
        - protocol: TCP
          port: 8082
        - protocol: TCP
          port: 8083
        - protocol: TCP
          port: 8090
    - to:
        - namespaceSelector: {}
      ports:
        - protocol: TCP
          port: 443
        - protocol: TCP
          port: 53
        - protocol: UDP
          port: 53

