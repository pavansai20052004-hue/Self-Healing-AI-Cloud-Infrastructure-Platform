apiVersion: v1
kind: ServiceAccount
metadata:
  name: healing-engine
  namespace: aegiscloud
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: healing-engine
  namespace: aegiscloud
rules:
  - apiGroups: ["apps"]
    resources: ["deployments", "deployments/scale"]
    verbs: ["get", "list", "watch", "patch", "update"]
  - apiGroups: [""]
    resources: ["pods", "events"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: healing-engine
  namespace: aegiscloud
subjects:
  - kind: ServiceAccount
    name: healing-engine
    namespace: aegiscloud
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: healing-engine

